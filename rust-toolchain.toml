# Reproducible default and release toolchain. Linux/macOS also check, test and
# package on stable with asupersync's optional nightly-outcome-try disabled.
# Windows needs nightly for windows_by_handle in oraclemcp-core and
# oraclemcp-audit (link counts and volume/file identity). See docs/toolchain.md.
[toolchain]
channel = "nightly-2026-05-11"
components = ["rustfmt", "clippy"]
