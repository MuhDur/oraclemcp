name: Publish to MCP Registry

# Lists oraclemcp in the official MCP registry (registry.modelcontextprotocol.io)
# under the io.github.MuhDur namespace, authenticated via GitHub OIDC — the
# repository's own identity proves namespace ownership, so no token/secret.
#
# server.json references the immutable release-version tag built by release.yml.
# Dispatch requires an existing stable GitHub release; validation binds the tag,
# main ancestry, server.json, and signed GHCR digest before any job receives an
# OIDC token.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable release version to publish (without v)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-mcp-${{ inputs.version }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: nightly-2026-05-11

jobs:
  validate:
    name: validate immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      image_digest: ${{ steps.release.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: Validate workflow dependency policy
        run: bash scripts/workflow_supply_chain_check.sh
      - name: Bind tag, source, release, and signed image
        id: release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify_mcp_release.sh validate
      - name: Validate complete release metadata
        env:
          RELEASE_TAG: v${{ steps.release.outputs.version }}
          RELEASE_REQUIRE_MAIN: "true"
          # Operator ruling 2026-07-21 (plan v8 §Z2): mutation seal advisory
          # this train — loud warning, never a release blocker.
          ALLOW_STALE_MUTATION_SEAL: "1"
        run: bash scripts/release_preflight.sh

  publish:
    name: publish server.json
    needs: validate
    runs-on: ubuntu-latest
    environment: mcp-registry
    timeout-minutes: 10
    permissions:
      id-token: write # required for GitHub OIDC authentication
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.validate.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: Revalidate exact release before OIDC login
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify_mcp_release.sh revalidate
      - name: Install mcp-publisher
        run: bash scripts/install_mcp_publisher.sh
      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  verify:
    name: verify registry listing
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.validate.outputs.version }}
          persist-credentials: false
      - name: Verify MCP registry listing
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' server.json)"
          image="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)"
          for _ in $(seq 1 30); do
            if curl -fsS 'https://registry.modelcontextprotocol.io/v0/servers?search=oraclemcp&limit=20' |
              jq -e --arg version "$version" --arg image "$image" '
                .servers[]
                | select(.server.name == "io.github.MuhDur/oraclemcp")
                | select(.server.version == $version)
                | select(any(.server.packages[]?; .registryType == "oci" and .identifier == $image))
              ' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "MCP registry did not list io.github.MuhDur/oraclemcp $version with $image" >&2
          exit 1
