name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Tier C (release-only, plan §7): the tier-C runner dispatches this workflow
  # on the release-candidate ref; `feature-powerset` and `multi-nightly` run
  # only here and refuse any checkout that is not exactly `candidate_sha`.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact release-candidate revision the tier-C lanes must build
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-05-11
  NODE_VERSION: 22.17.0
  # Independent policy for the local Required replay. The replay validates its
  # derived command IDs and exact argv graph against these CI-owned commitments
  # before running or verifying a proof; changing only the projection and proof
  # therefore fails closed.
  REQUIRED_LOCAL_COMMAND_IDS: "api-lock,bead-close-evidence,clippy,fixture-lint,format,honesty-grep,seam-lint,supply-chain-checks,surface-sync,test-workspace"
  REQUIRED_LOCAL_GRAPH_SHA256: "790280daa312c26ad2a3b613944d4fc330c76006952f8e68987bd7f66c557c53"
  PSSCRIPTANALYZER_VERSION: "1.25.0"
  PYTHON_ORACLEDB_VERSION: "4.0.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let a main run finish so Swatinem/rust-cache
  # can SAVE the build cache. Cancelling main mid-run (as rapid pushes did) left
  # caches cold and made the heavy plsql/ANTLR compile take hours every time.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-build:
    name: web bundle (npm ci + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflow dependency policy
        run: bash scripts/workflow_supply_chain_check.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Install dashboard Chromium runtime
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify end-user dashboard workflows in Chromium
        run: npm run test:e2e:dashboard
        working-directory: web
      - run: bash scripts/dashboard_bundle_check.sh
      - uses: actions/upload-artifact@v7
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p oraclemcp-core --all-targets --features dashboard-bundle -- -D warnings
      - run: cargo clippy -p oraclemcp --all-targets --features dashboard-bundle -- -D warnings

  test:
    name: cargo test
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test --workspace --all-targets
        run: |
          set -euo pipefail
          mkdir -p target/ci-logs
          cargo test --workspace --all-targets 2>&1 | tee target/ci-logs/cargo-test.log
      - run: bash scripts/oraclemcp_concurrency_lint.sh --test-output target/ci-logs/cargo-test.log
      - run: cargo test --workspace --doc
      # The live suites are runtime-gated, so the default workspace test never
      # compiles their targets. Keep both crates' live test interfaces in the
      # per-push build graph without requiring an Oracle service in CI.
      - name: compile env-gated live Oracle test targets
        run: |
          cargo check -p oraclemcp-db --tests --features live-xe,oracledb
          cargo check -p oraclemcp --tests --features live-xe
      # Runtime coverage of the optional feature interactions. The feature-powerset
      # job is now a compile+lint gate only (clippy over the powerset), so the
      # actual test behaviour under dashboard-bundle / mimalloc is exercised here.
      # Scoped to --lib/--bins on purpose: the dashboard-bundle runtime tests are
      # lib unit tests (core src/http/tests_stores.rs) and mimalloc only swaps the
      # allocator in main.rs, so this covers the feature-gated behaviour. Using
      # --all-targets would additionally re-run the feature-IRRELEVANT integration
      # tests (the ~100s build-state-sensitive trybuild capability_compile_fail and
      # the omcpb-dependent e2e_harness) under these features for no added signal.
      - run: cargo test -p oraclemcp-core --lib --features dashboard-bundle
      - run: cargo test -p oraclemcp --lib --bins --features dashboard-bundle,mimalloc
      # Golden-artifact discipline (D6.3d): CI VERIFIES goldens and never
      # regenerates them. A drift is a real regression, so UPDATE_GOLDENS must
      # never be set here and the golden suites must match the committed
      # fixtures. The shared `Scrubber` (tests/golden/support.rs) keeps them
      # deterministic and secret-free; the insta surface refuses to update in CI.
      - name: golden-artifact discipline (fail on any un-approved golden diff)
        run: |
          set -euo pipefail
          if [ -n "${UPDATE_GOLDENS:-}" ]; then
            echo "::error::UPDATE_GOLDENS must never be set in CI" >&2
            exit 1
          fi
          cargo test -p oraclemcp      --test golden_behavior
          cargo test -p oraclemcp      --test golden_scrubber_framework
          cargo test -p oraclemcp-core --test golden_behavior --test doctor_secret_golden
          cargo test -p oraclemcp-db   --test structured_schema_golden

  feature-powerset:
    name: feature powerset (cargo hack)
    needs: web-build
    # Tier C (plan §7): release candidates only, via workflow_dispatch; its
    # result enters the release proof instead of the per-push check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Compile + lint gate only: `cargo hack clippy` over the feature powerset of
    # the three feature-owning crates (oraclemcp-db / -core / oraclemcp). The
    # prior 3-pass (check+clippy+test) x --workspace x --all-targets was ~50min;
    # clippy already type-checks + compiles, and per-combo runtime behaviour is
    # covered by the default `test` job's dashboard-bundle / mimalloc runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact release-candidate revision
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$CANDIDATE_SHA" ] || {
            echo "::error::tier-C checkout is $actual, expected $CANDIDATE_SHA" >&2
            exit 1
          }
      # Even the narrowed clippy powerset accretes a shared target/ dir; free the
      # preinstalled toolchains we don't use so a large combo can't hit "No space
      # left on device". rustup installs to ~/.cargo + ~/.rustup, not
      # hostedtoolcache, so removing the tool cache is safe here.
      - name: Free disk space for the feature powerset
        run: |
          sudo rm -rf \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /opt/hostedtoolcache /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/miniconda \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-hack
      # Retro C5: assert (and, if needed, reclaim) free disk right before the
      # heavy build so a low-disk runner fails fast with a clear message
      # instead of dying mid-`cargo hack clippy` with an opaque ENOSPC.
      - name: Disk-free preflight (fail fast before ENOSPC mid-build)
        run: bash scripts/feature_powerset_disk_preflight.sh
      - run: bash scripts/oraclemcp_feature_powerset.sh

  ergonomics:
    name: agent ergonomics drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/oraclemcp_ergonomics_lint.sh

  installer:
    name: installer lint and built-artifact smoke
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install installer lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck musl-tools
      - run: cargo build -p oraclemcp --features dashboard-bundle --target x86_64-unknown-linux-musl
      - name: installer offline smoke
        env:
          ORACLEMCP_INSTALLER_REQUIRE_SHELLCHECK: "1"
          ORACLEMCP_INSTALLER_BUILT_BINARY: target/x86_64-unknown-linux-musl/debug/oraclemcp
        run: bash scripts/installer_lint_and_offline_smoke.sh --log

  windows-installer:
    name: Windows installer PSSA and dry-run
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer and dry-run contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $requiredPssaVersion = [version]$env:PSSCRIPTANALYZER_VERSION
          Install-Module PSScriptAnalyzer -Repository PSGallery -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force

          $parseErrors = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content -LiteralPath "install.ps1" -Raw), [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

          Import-Module PSScriptAnalyzer -RequiredVersion $requiredPssaVersion -Force
          $loadedPssaVersions = @((Get-Module PSScriptAnalyzer).Version)
          if ($loadedPssaVersions.Count -ne 1 -or $loadedPssaVersions[0] -ne $requiredPssaVersion) {
            throw "Loaded PSScriptAnalyzer versions $($loadedPssaVersions -join ', '); expected exactly $requiredPssaVersion"
          }
          $violations = Invoke-ScriptAnalyzer -Path "install.ps1" -Severity Error,Warning
          if ($violations) {
            $violations | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

          $offline = Join-Path $env:RUNNER_TEMP "oraclemcp-x86_64-pc-windows-msvc.zip"
          $trustedRoot = Join-Path $env:RUNNER_TEMP "sigstore-trusted-root.json"
          Set-Content -LiteralPath $trustedRoot -Value '{"mediaType":"application/vnd.dev.sigstore.trustedroot+json;version=0.1"}'
          $dry = .\install.ps1 -DryRun -Version 9.9.9-installer-smoke -Prefix (Join-Path $env:RUNNER_TEMP "oraclemcp") -Offline $offline -TrustedRoot $trustedRoot
          $dryText = $dry -join "`n"
          if ($dryText -notmatch "mode: offline") {
            throw "Windows installer dry-run did not report offline mode"
          }
          if ($dryText -match "service install --yes") {
            throw "Windows installer dry-run mutated service without -Service"
          }
          if ($dryText -notmatch [regex]::Escape("offline_sigstore_trusted_root: $trustedRoot")) {
            throw "Windows installer dry-run omitted the offline Sigstore trusted root"
          }

          # Execute the byte-identity decision directly: equal version strings
          # never authorize a no-op when the verified archive bytes differ.
          $functions = Join-Path $env:RUNNER_TEMP "oraclemcp-installer-functions.ps1"
          (Get-Content -LiteralPath "install.ps1" | Where-Object { $_ -cne "Invoke-Main" }) |
            Set-Content -LiteralPath $functions
          . $functions
          $sourceBytes = Join-Path $env:RUNNER_TEMP "verified-oraclemcp.exe"
          $installedBytes = Join-Path $env:RUNNER_TEMP "installed-oraclemcp.exe"
          $script:BinDir = $env:RUNNER_TEMP
          $script:Prefix = Join-Path $env:RUNNER_TEMP "oraclemcp-byte-test"
          Set-Content -LiteralPath $sourceBytes -Value "verified release bytes"
          Set-Content -LiteralPath $installedBytes -Value "same version, different bytes"
          Install-ExecutableAtomically -Source $sourceBytes -Destination $installedBytes -Name "oraclemcp.exe"
          if ((Get-FileHash -LiteralPath $sourceBytes -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $installedBytes -Algorithm SHA256).Hash) {
            throw "same-version payload with different bytes was not replaced"
          }

          $serviceDryRun = .\install.ps1 -DryRun -Version 9.9.9-installer-smoke -Prefix (Join-Path $env:RUNNER_TEMP "oraclemcp") -Service -Yes -Profile db_ro -Listen 127.0.0.1:7070
          $serviceText = $serviceDryRun -join "`n"
          if ($serviceText -notmatch "service install --yes --name oraclemcp --listen 127.0.0.1:7070 --profile db_ro") {
            throw "Windows installer service dry-run did not show the consent-gated service command"
          }

  windows-rust:
    name: Rust workspace (Windows)
    # Advisory lanes run on pull requests, not on direct pushes to main, so the
    # main per-commit badge reflects only the required lanes. This lane's real
    # state (the tracked audit-DACL failure, oraclemcp-xuaea) stays visible on
    # every PR and is not hidden — it just no longer stamps a red check on the
    # release commits that land straight on main.
    if: github.event_name == 'pull_request'
    needs: web-build
    runs-on: windows-latest
    # Advisory until the native-Windows audit-DACL hardening lands. Operator
    # steering 2026-09-16 (bead oraclemcp-2q4em.2.1; tracked by
    # oraclemcp-xuaea): the strict-ownership fix needs an atomic
    # CreateDirectoryW + SECURITY_ATTRIBUTES create-time descriptor, which has
    # no vetted safe wrapper and conflicts with #[forbid(unsafe_code)], so the
    # lane is demoted rather than fixed. `continue-on-error: true` is what makes
    # scripts/ci_taxonomy.py classify this job `advisory`; the Windows
    # installer/service lane stays required.
    continue-on-error: true
    env:
      # E1's mandatory direct-Cargo interceptor is the POSIX flock host guard.
      # This runner is single-tenant (the documented CI lease waiver), and a
      # Windows process cannot execute the repository's Bash rustc-wrapper.
      RUSTC_WRAPPER: ""
    # Scope: --lib --bins (see the test step). All Windows-specific risk (file
    # locking, subprocess spawn, TLS, paths, durable state) lives in unit tests;
    # the integration tests are covered on Linux and by the dedicated
    # windows-installer job, and recompiling every integration-test binary here
    # made an --all-targets build ~75-80 min (windows-msvc linking is slow). With
    # --lib --bins + reduced debuginfo this is far shorter; keep some headroom for
    # the first cold run after the profile/cache-key change.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # This job previously had NO cache, so every run cold-compiled the whole
      # workspace and eventually exceeded the timeout. Cache like the Linux jobs
      # (separate key: rust-cache keys include the OS/target, so no collision).
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # rust-cache defaults to cache-on-failure:false. While a Windows test
          # is red the job fails, so the cache would never save and every run
          # would cold-compile (~60-70 min) and time out — a vicious cycle.
          # Save the compiled artifacts even on test failure so the NEXT run is
          # warm and fast; this is what lets us iterate on Windows test fixes.
          cache-on-failure: true
      - name: cargo test workspace on Windows
        env:
          # windows-msvc link time is dominated by debuginfo; drop it to cut the
          # compile. Tests run identically and panic `file:line` (via
          # #[track_caller]) is unaffected — only RUST_BACKTRACE frame detail is.
          CARGO_PROFILE_TEST_DEBUG: "0"
        # --lib --bins, not --all-targets: the Windows-specific behaviour is in
        # unit tests; the integration-test binaries add little Windows signal,
        # are covered on Linux, and roughly double the windows-msvc compile.
        run: cargo test --workspace --lib --bins

  release-acceptance:
    name: release acceptance suite (B.12)
    needs: [web-build, test, feature-powerset, ergonomics, installer, windows-installer, boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/release_acceptance_ci_suite.sh --skip-feature-powerset

  # The thin-native line is pinned to nightly. Asupersync depends on specific nightly-only language features,
  # pulled in transitively by its dependency declaration; oraclemcp-driver-cx 0.9.3 is stable-clean
  # (see docs/toolchain.md). This is a build-only ratchet separate from the test job
  # so toolchain installation failures stay obvious.
  pinned-nightly:
    name: build on pinned nightly
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace
      - run: cargo build -p oraclemcp --features dashboard-bundle

  # Multi-nightly early-warning (bead D4 / WP-D). Tier C (plan §7): it runs only
  # when the tier-C runner dispatches this workflow on a release candidate, and
  # its result enters the release proof. The pinned nightly (nightly-2026-05-11)
  # is already covered by the tier-A jobs above (`build on pinned nightly`,
  # `cargo test`, clippy), so this job only builds and tests against the
  # *floating* `nightly` channel: an upcoming toolchain that will break the
  # Asupersync stack surfaces here before we deliberately re-pin (see
  # docs/toolchain.md + ADR-0001). When bisecting a regression, temporarily add
  # a pinned date back to the matrix.
  multi-nightly:
    name: multi-nightly early-warning
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - nightly              # floating: the next toolchain we may have to adopt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact release-candidate revision
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$CANDIDATE_SHA" ] || {
            echo "::error::tier-C checkout is $actual, expected $CANDIDATE_SHA" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.toolchain }}
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +${{ matrix.toolchain }} build --workspace
      - run: cargo +${{ matrix.toolchain }} test --workspace --all-targets

  docs:
    name: cargo doc (builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Ensure the docs build; intra-doc-link lints are not gated (some target
      # feature-gated items that are absent in the default-feature doc build).
      - run: cargo doc --workspace --no-deps

  # The one-way engine-free boundary: no oraclemcp-* crate may import a plsql-*
  # engine crate. Trivially satisfied in this repo (there are no plsql-* crates),
  # but kept as a standing guard against an accidental re-introduction.
  #
  # The driver-adapter seam (B2): every real `oraclemcp_driver_cx::` call stays
  # behind the single adapter file so a driver cut-over touches one boundary.
  # Mirrored by the
  # `driver_seam` test in crates/oraclemcp-db so `cargo test` catches a leak too.
  boundary:
    name: engine-free boundary + surface + driver-seam + honesty + conformance accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the bead-close-evidence audit resolves commit SHAs
          # cited by close evidence; a shallow checkout reports SOURCE_SHA_ABSENT
          # for perfectly valid main-reachable commits (2026-07-20 red).
          fetch-depth: 0
      - name: Install pinned ripgrep for architecture lint
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep=14.1.0-1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Never save from the boundary job: keep cache ownership on the
          # test/clippy jobs so a docs-only build cannot evict a warm population.
          save-if: false
      # Generated-docs drift: the README tool/alias tables and the config field
      # reference are rendered from the registry/config types, never hand-written
      # (beads oraclemcp-2q4em.3.1/.3.2). This builds only the one binary the
      # renderer needs, so the boundary job stays cheap; `docs_generate.sh
      # --check` fails with a unified diff on any drift.
      - name: generated docs match the registry and config types
        run: |
          cargo build -p oraclemcp
          bash scripts/docs_generate.sh --check
      - run: bash scripts/oraclemcp_boundary_lint.sh
      - run: bash scripts/oraclemcp_arch_fitness_lint.sh
      - run: bash scripts/oraclemcp_agent_surface_lint.sh
      - run: bash scripts/oraclemcp_driver_seam_lint.sh
      - run: bash scripts/oraclemcp_concurrency_lint.sh
      - run: bash scripts/oraclemcp_honesty_grep.sh
      - run: bash scripts/oraclemcp_fixture_lint.sh
      - name: release 0.12 field case manifest
        run: |
          python3 scripts/e2e/cases/validate_manifest.py --selftest
          python3 scripts/e2e/cases/validate_manifest.py scripts/e2e/cases/release_0_12.json
      # Constitution rules 13-17: the swarm-discipline mechanisms must keep
      # refusing what they were built to refuse, and committed shell must not
      # reintroduce a wait that cannot end (rule 16).
      - name: swarm discipline (constitution rules 13-18)
        run: |
          bash scripts/swarm_discipline.sh --selftest
          bash scripts/swarm_discipline.sh unbounded-wait-lint
      # D4 (plan §25.7.3): the fuzz lane's nightly wall clock is one shard, not
      # the sum, and only while every shard stays sharded, timeout-bounded, and
      # carries -max_total_time. Asserted here so it cannot quietly regress.
      # P6: the manifest validator is a gate, so it must be able to FAIL. The
      # selftest feeds it a known-good graph and then one targeted mutation per
      # rule, requiring the matching error code each time.
      - name: plan-bead-graph lint selftest (P6)
        run: python3 scripts/plan_bead_graph_lint.py --selftest
      # D8: a preflight that reports healthy and is then followed by a rig
      # failure is worse than none, because it points suspicion at the wrong
      # component. The selftest proves every check can refuse AND that the check
      # inventory still covers what scripts/rig/oracle_l1.sh actually enforces —
      # add a `command -v` or a lane to the rig without a check here and this
      # fails. Needs no Docker: it only aims checks at broken environments.
      - name: rig doctor selftest (D8)
        run: bash scripts/rig/rig_doctor.sh --selftest
      # D9: vendored MIT sample schemas. The gate refuses drift against the
      # pinned upstream commit, a missing licence, AND any file the manifest
      # does not list — the last one is the governance half, so an unvetted
      # schema cannot inherit the vendored tree's implied "this was checked".
      - name: vendored sample schema governance (D9)
        run: |
          bash scripts/rig/verify_sample_schemas.sh
          bash scripts/rig/verify_sample_schemas.sh --selftest
      # D4: the same mistake bit the driver repo twice — a required step that
      # needed a tool the job had not installed yet. This refuses a workflow
      # where a step uses a tool its own job installs LATER, or never.
      - name: CI step tool-order (D4)
        run: |
          python3 scripts/ci_step_tool_order_lint.py --selftest
          python3 scripts/ci_step_tool_order_lint.py
      - name: Required local projection policy
        run: python3 scripts/verify_required_local.py --policy-check
      - name: fuzz lane budget (D4)
        run: |
          python3 scripts/ci_lane_budget.py --selftest
          python3 scripts/ci_lane_budget.py fuzz-bound
      - name: bead close evidence (native policy + post-close binding)
        run: bash scripts/check_bead_close_evidence.sh
      - name: entry-trace contract (required SKIP=FAIL)
        run: bash scripts/check_entry_trace_contract.sh
      # B2.3: Keep-a-Changelog [Unreleased] is a release-debt clock. Any
      # feat/fix/security/perf commit since the last release tag must have a
      # human-written bullet under [Unreleased]; the paired contract test proves
      # the gate refuses an empty section and accepts a populated one.
      - name: changelog pace (feat/fix recorded under [Unreleased])
        run: |
          bash scripts/changelog_pace_lint.sh
          bash scripts/test_changelog_pace_lint.sh
      # D6.3a: regenerate tests/conformance/COVERAGE.md from the clause manifest
      # and fail if it is stale (git-tracked doc would change) or if MUST-clause
      # coverage falls below 0.95.
      - name: conformance coverage-accounting (staleness + MUST >= 0.95 gate)
        run: bash scripts/gen_coverage_report.sh --check
      # D6.3b: every committed generated artifact must have a provenance entry.
      - name: generated-artifact provenance register gate
        run: bash scripts/provenance_check.sh

  # Public-API lock (B5; ADR-0002 mirror). oraclemcp-db is the canonical shared
  # foundation (ADR-0006) and oraclemcp-error / oraclemcp-guard are the
  # engine-free spine plsql-mcp converges onto, so their public API is a product
  # with two consumers. Two complementary gates keep it from drifting:
  #   * cargo public-api — exact-surface diff against the committed baselines in
  #     crates/<crate>/api/<crate>.txt (deterministic, offline). Refresh the
  #     baseline in the same PR for an INTENTIONAL change (see the script header
  #     and crates/oraclemcp-db/README.md).
  #   * cargo semver-checks — reports changes against the previous in-repository
  #     release using the planned version and 0.x SemVer rules recorded in
  #     CHANGELOG.md. The committed public-API snapshots reject unreviewed drift.
  # Both tools render rustdoc JSON, so they run on the pinned nightly. The tools
  # are not workspace dependencies (installed as standalone binaries), so they do
  # not enter the dependency graph or affect cargo deny. semver-checks uses the
  # previous in-repository release tag and its committed lockfile, independent of
  # registry yanks; fetch full history so the baseline tag is available.
  api-lock:
    name: public-API lock (cargo public-api + semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-public-api,cargo-semver-checks
      # Prove the yanked historical lock and planted API break cases.
      - run: bash scripts/oraclemcp_api_lock.sh --selftest
      # Exact public-API surface lock against the committed baselines.
      - run: bash scripts/oraclemcp_api_lock.sh

  supply-chain:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo deny --features oraclemcp/dashboard-bundle,oraclemcp-core/dashboard-bundle check

  # Default builds include PL/SQL intelligence. Keep its full test lane
  # required and bounded with low-debug, parallel code generation settings.
  plsql-intelligence:
    name: PL/SQL intelligence feature matrix
    needs: web-build
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p oraclemcp --all-targets
      - name: Build engine-free opt-out binary
        run: cargo build -p oraclemcp --no-default-features
      - name: Keep engine-free opt-out build and tests green
        run: cargo test -p oraclemcp --all-targets --no-default-features
      - name: Assert all nine PL/SQL tools are registered
        run: bash scripts/plsql_feature_lane_check.sh --selftest
      - name: Refuse parser regeneration in release builds
        run: |
          set -euo pipefail
          bash scripts/antlr_codegen_release_gate.sh
          if PLSQL_ANTLR_REGEN=1 bash scripts/antlr_codegen_release_gate.sh; then
            echo "release gate accepted PLSQL_ANTLR_REGEN=1" >&2
            exit 1
          fi

  # Real Oracle FREE 23ai proves the current thin-driver line and the 23ai
  # VECTOR SQL surface. All connection values below are synthetic disposable
  # CI fixtures; no deployment or customer identifier is committed here.
  oracle-free23:
    name: Oracle FREE 23ai matrix + VECTOR smoke
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      free23:
        image: gvenzl/oracle-free:23-slim@sha256:fbbd3023d5abc33e36d3814816e6fd740e8efabeaa70cf470ddeab5874a3f6f8
        env:
          ORACLE_PASSWORD: E2EOracle23
          APP_USER: E2E_ORACLE
          APP_USER_PASSWORD: E2EOracle23
        ports:
          - 1522:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # CI supplies a prebuilt binary to the harness. Local execution keeps the
      # harness on omcpb, which owns target isolation, memory caps, and the pin.
      - run: cargo build -p oraclemcp --bin oraclemcp --features dashboard-bundle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Grant DBMS_FLASHBACK to the 23ai app user for SCN capture
        # The governed read path captures the snapshot SCN via
        # DBMS_FLASHBACK.GET_SYSTEM_CHANGE_NUMBER (V$DATABASE only as a fallback).
        # The gvenzl app user has neither by default, so every governed read on
        # this lane fails closed (ORA-00904 then ORA-00942). Grant the capability
        # the design expects. Synthetic disposable CI DB; the SYSTEM password is
        # the committed fixture value in this job's service env.
        run: |
          set -euo pipefail
          test "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          wheelhouse="$RUNNER_TEMP/oracledb-wheelhouse"
          mkdir -p "$wheelhouse"
          python3 -m pip download --disable-pip-version-check --only-binary=:all: \
            --require-hashes --dest "$wheelhouse" -r containers/python-oracledb-requirements.lock
          python3 -m pip install --disable-pip-version-check --no-index \
            --find-links "$wheelhouse" --require-hashes \
            -r containers/python-oracledb-requirements.lock
          python3 - <<'PY'
          import os
          import oracledb

          expected = os.environ["PYTHON_ORACLEDB_VERSION"]
          if oracledb.__version__ != expected:
              raise RuntimeError(f"loaded python-oracledb {oracledb.__version__}; expected exactly {expected}")
          c = oracledb.connect(user='sys', password='E2EOracle23', dsn='localhost:1522/FREEPDB1', mode=oracledb.AUTH_MODE_SYSDBA)
          c.cursor().execute('GRANT EXECUTE ON DBMS_FLASHBACK TO E2E_ORACLE')
          c.commit()
          print('granted EXECUTE ON DBMS_FLASHBACK to E2E_ORACLE')
          PY
      - name: 23ai matrix lane, VECTOR_DISTANCE, and PL/SQL round-trip smoke
        id: free23-matrix
        env:
          ORACLEMCP_LIVE_XE: "1"
          ORACLEMCP_ORACLE_MATRIX_BINARY: target/debug/oraclemcp
          ORACLE_MATRIX_FREE23_DSN: localhost:1522/FREEPDB1
          ORACLE_MATRIX_FREE23_USER: E2E_ORACLE
          ORACLE_MATRIX_FREE23_PASSWORD: E2EOracle23
        run: |
          set -euo pipefail
          mkdir -p target/test-attestation-evidence
          bash scripts/e2e/oracle_version_matrix.sh --log --lane free23 2>&1 \
            | tee target/test-attestation-evidence/e2e-oracle-version-matrix-free23.log
      - name: Derive e2e attestation outcome
        if: always()
        id: e2e-attestation
        run: |
          set -euo pipefail
          case "${{ steps.free23-matrix.outcome }}" in
            success) outcome=PASS ;;
            failure) outcome=FAIL ;;
            cancelled|skipped) outcome=SKIP ;;
            *) outcome=FAIL ;;
          esac
          echo "tests=e2e:oracle-version-matrix-free23=$outcome" >> "$GITHUB_OUTPUT"
          printf 'e2e:oracle-version-matrix-free23=%s\n' "$outcome"
      - name: Record e2e-lane attestation status
        if: always()
        uses: ./.github/actions/test-attestation
        env:
          ORACLEMCP_TEST_ATTESTATION_KEY: ${{ secrets.ORACLEMCP_TEST_ATTESTATION_KEY }}
          ORACLEMCP_TEST_ATTESTATION_KEY_ID: ${{ vars.TEST_ATTESTATION_KEY_ID || 'github-actions-v1' }}
        with:
          enabled: ${{ vars.ENABLE_TEST_ATTESTATION == 'true' }}
          trusted-context: ${{ github.event_name == 'push' }}
          lane: e2e-oracle-free23
          command: bash scripts/e2e/oracle_version_matrix.sh --log --lane free23
          tests: ${{ steps.e2e-attestation.outputs.tests }}
          artifacts: target/test-attestation-evidence/e2e-oracle-version-matrix-free23.log
          output-name: e2e-oracle-free23.jsonl
      - name: Verify the e2e attestation this lane produced
        if: always()
        run: |
          python3 scripts/check_test_attestations.py --selftest
          python3 scripts/check_test_attestations.py target/test-attestations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-oracle-free23-attestation-${{ github.run_number }}
          path: |
            target/test-attestation-evidence/e2e-oracle-version-matrix-free23.log
            target/test-attestations/
          if-no-files-found: error
          retention-days: 30

  # No deployment-specific identifiers or secrets may reach the public repo.
  # Generic heuristics run here; operators add a site denylist locally via
  # $ORACLEMCP_SENSITIVE_DENYLIST_FILE + a pre-push hook (see the script).
  sensitive-data:
    name: sensitive-data lint
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: oraclemcp-dashboard-dist
          path: web/dist
      - run: bash scripts/secret_scan.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: bash scripts/container_python_lock_selftest.sh
      - run: bash tests/container_supply_chain_contract_test.sh --context

  # Compile every cargo-fuzz target so it cannot silently rot: guard classifier
  # + ALTER SESSION, audit-chain verification, and OAuth bearer validation.
  # Build-only; campaigns run
  # locally with `cargo +nightly-2026-05-11 fuzz run <target>`. Non-blocking:
  # cargo-fuzz + build-std is inherently churn-prone, so a transient toolchain
  # break here must not redden the rest of CI.
  fuzz-build:
    name: fuzz targets compile (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # PRs restore the main cache but never save (their short-lived
          # merge-ref caches would evict the useful main population).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-fuzz
        # Pin the gnu target: cargo-fuzz otherwise defaults to musl here, whose
        # static libc is incompatible with the ASan sanitizer.
      - name: Build guard fuzz targets
        run: cargo +${{ env.RUST_TOOLCHAIN }} fuzz build --target x86_64-unknown-linux-gnu
        working-directory: crates/oraclemcp-guard
      - name: Build audit fuzz targets
        run: cargo +${{ env.RUST_TOOLCHAIN }} fuzz build --target x86_64-unknown-linux-gnu
        working-directory: crates/oraclemcp-audit
      - name: Build auth fuzz targets
        run: cargo +${{ env.RUST_TOOLCHAIN }} fuzz build --target x86_64-unknown-linux-gnu
        working-directory: crates/oraclemcp-auth
