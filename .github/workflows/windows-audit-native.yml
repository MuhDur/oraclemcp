# The operator uses this exact-SHA verdict to verify Windows audit ACL
# hardening (.12.1) before the 0.12 release. The observed defect is the
# elevated runner's TokenOwner differing from TokenUser on fresh objects.
# Remove this manual lane when the regular Windows workspace job is required
# on main again.
name: Windows audit native proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source revision to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-audit-native:
    name: Windows audit native workspace
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      RUSTC_WRAPPER: ""
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact source revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Windows proof checked out $actual, expected $env:EXPECTED_SHA"
          }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-05-11
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-on-failure: true
      - name: Test Windows workspace libraries and binaries
        run: cargo test --workspace --lib --bins
