name: Fuzz Campaign

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TOOLCHAIN: nightly-2026-05-11
  FUZZ_SECONDS: "300"

jobs:
  fuzz:
    name: fuzz ${{ matrix.crate }} / ${{ matrix.target }} shard ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: oraclemcp-audit
            target: chain_verify
            shard: 0
            shards: 1
            seed: 1001
          - crate: oraclemcp-auth
            target: oauth_token_validate
            shard: 0
            shards: 1
            seed: 2001
          - crate: oraclemcp-guard
            target: alter_session_parse
            shard: 0
            shards: 4
            seed: 3001
          - crate: oraclemcp-guard
            target: alter_session_parse
            shard: 1
            shards: 4
            seed: 3002
          - crate: oraclemcp-guard
            target: alter_session_parse
            shard: 2
            shards: 4
            seed: 3003
          - crate: oraclemcp-guard
            target: alter_session_parse
            shard: 3
            shards: 4
            seed: 3004
          - crate: oraclemcp-guard
            target: classify_fuzz
            shard: 0
            shards: 1
            seed: 4001
          - crate: oraclemcp-guard
            target: grant_scope_match
            shard: 0
            shards: 2
            seed: 6001
          - crate: oraclemcp-guard
            target: grant_scope_match
            shard: 1
            shards: 2
            seed: 6002
          - crate: oraclemcp-guard
            target: grant_predicate
            shard: 0
            shards: 1
            seed: 7001
          - crate: oraclemcp-config
            target: config_toml
            shard: 0
            shards: 1
            seed: 5001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz -> target
          shared-key: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          save-if: ${{ github.event_name == 'schedule' }}
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-fuzz
      # The two guard targets are coverage-guided safety proofs, not a fixed
      # proxy corpus. Keep each shard's discovered inputs independently so
      # concurrent ALTER SESSION shards never race to replace a shared cache.
      # `run_id` makes each saved cache immutable; restore-keys selects the
      # newest prior corpus for the same target/shard on the next campaign.
      - name: Restore persistent guard fuzz corpus
        if: ${{ matrix.crate == 'oraclemcp-guard' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}/shard-${{ matrix.shard }}
          key: fuzz-corpus-v1-${{ matrix.crate }}-${{ matrix.target }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.crate }}-${{ matrix.target }}-shard-${{ matrix.shard }}-
      - name: Run bounded corpus campaign
        working-directory: crates/${{ matrix.crate }}/fuzz
        # The prebuilt cargo-fuzz binary is musl-linked, and cargo-fuzz
        # defaults --target to the triple IT was built for — which selects
        # x86_64-unknown-linux-musl here, where ASan is incompatible with
        # statically linked libc ("sanitizer is incompatible with statically
        # linked libc"). Pin the gnu host triple explicitly.
        run: |
          mkdir -p "artifacts/${{ matrix.target }}/shard-${{ matrix.shard }}"
          mkdir -p "corpus/${{ matrix.target }}/shard-${{ matrix.shard }}"
          cargo +${{ env.RUST_TOOLCHAIN }} fuzz run \
          --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
          "corpus/${{ matrix.target }}/shard-${{ matrix.shard }}" -- \
          -max_total_time=${{ env.FUZZ_SECONDS }} \
          -rss_limit_mb=2048 \
          -timeout=10 \
          -seed=${{ matrix.seed }} \
          -artifact_prefix="artifacts/${{ matrix.target }}/shard-${{ matrix.shard }}/"
      - name: Persist expanded guard fuzz corpus
        if: ${{ success() && matrix.crate == 'oraclemcp-guard' && github.event_name == 'schedule' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}/shard-${{ matrix.shard }}
          key: fuzz-corpus-v1-${{ matrix.crate }}-${{ matrix.target }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload crash and timeout artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}-shard-${{ matrix.shard }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
