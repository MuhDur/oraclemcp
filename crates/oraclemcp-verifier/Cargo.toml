[package]
name = "oraclemcp-verifier"
version = "0.11.0"
description = "Standalone external verifier for redacted oraclemcp verdict certificates"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/oraclemcp-verifier"
# Ship the library, the test-attestation binary, the README and the license
# texts; tests and their fixtures stay in the repository.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
oraclemcp-audit = { path = "../oraclemcp-audit", version = "0.11.0" }
oraclemcp-guard = { path = "../oraclemcp-guard", version = "0.11.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
